name: Build libraries (dist)

# Les projets consommateurs (bailo, subsidia…) embarquent ce dépôt en sous-module et lisent
# `projects/<lib>/dist` sans rien compiler. En local, les libs se construisent dans `.build/`
# (ignoré) : seul ce workflow écrit les `dist` versionnés, par un commit ajouté à la branche poussée
# (develop ou main). L'historique n'est jamais réécrit — un sous-module pointe un commit précis, qui
# doit rester joignable.

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write

# Une seule publication à la fois par branche ; un push arrivé pendant un build attend son tour.
concurrency:
  group: build-libs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Nx 22 ne tourne pas sous Node 18 (fin de support).
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build @ta libraries
        run: yarn build

      - name: Copy .build into the versioned dist folders
        run: |
          find projects -mindepth 2 -maxdepth 3 -type d -name .build -not -path '*/node_modules/*' | while read -r build; do
            dist="$(dirname "$build")/dist"
            rm -rf "$dist"
            cp -R "$build" "$dist"
            echo "✔ $build → $dist"
          done

      - name: Commit and push dist
        env:
          SOURCE_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -A : les fichiers disparus d'un build doivent aussi disparaître du dépôt.
          # -f : les dist sont couverts par aucune règle d'ignore aujourd'hui, mais une nouvelle lib
          #      pourrait l'être ; on force pour ne jamais publier un dist partiel.
          git add -A -f -- 'projects/*/dist' 'projects/*/*/dist'

          if git diff --cached --quiet; then
            echo "Aucun changement dans les dist : rien à publier."
            exit 0
          fi

          # Un commit plus récent est arrivé sur la branche : son propre run publiera des dist
          # à jour. Pousser ceux-ci par-dessus les ferait passer pour le build de ce commit-là.
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse "origin/$BRANCH")" != "$SOURCE_SHA" ]; then
            echo "origin/$BRANCH a avancé depuis $SOURCE_SHA : publication laissée au run suivant."
            exit 0
          fi

          # Le commit source est noté dans le message (trailer Dist-Source), pas dans un fichier :
          # develop et main en écriraient chacune un différent, et chaque merge entre elles
          # tomberait en conflit dessus.
          git commit -m "chore(dist): build ${SOURCE_SHA::8} [skip ci]" -m "Dist-Source: $SOURCE_SHA"
          git push origin "HEAD:$BRANCH"
