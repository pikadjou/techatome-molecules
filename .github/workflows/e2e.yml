name: e2e

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Nx 22 ne tourne pas sous Node 18 (fin de support).
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: Build @ta libraries
        run: yarn build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test showcase metadata generator
        run: yarn test:showcase-metadata

      - name: Generate showcase metadata
        run: yarn showcase:metadata

      - name: Run e2e tests
        run: yarn e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
