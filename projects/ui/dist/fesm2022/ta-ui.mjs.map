@if (this.value()) {
  <div
    class="trigram"
    [ngClass]="this.getClasses()"
    [ngStyle]="{
      'width.px': this.size(),
      'height.px': this.size(),
      'line-height.px': this.size(),
      'font-size.px': this.getFontSize(),
    }"
  >
    {{ this.value() }}
  </div>
}
