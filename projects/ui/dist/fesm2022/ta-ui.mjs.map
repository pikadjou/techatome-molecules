<div class="stat-tile" [ngClass]="this.getClasses()">
  @if (this.icon(); as icon) {
    <span class="stat-tile-icon">
      <ta-font-icon [name]="icon" type="sm"></ta-font-icon>
    </span>
  }

  <div class="stat-tile-body">
    @if (this.layout() === 'label-first') {
      <ta-overline size="sm">{{ this.label() }}</ta-overline>
      <span class="stat-tile-value">
        {{ this.value() }}
        <ng-content></ng-content>
      </span>
    } @else {
      <span class="stat-tile-value">
        {{ this.value() }}
        <ng-content></ng-content>
      </span>
      <span class="stat-tile-label">{{ this.label() }}</span>
    }
  </div>
</div>
