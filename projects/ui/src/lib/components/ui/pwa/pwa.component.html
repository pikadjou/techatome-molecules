@if (this.isShowed) {
  <div class="pwa-layout">
    <ta-toast>
      <div class="pwa-container invert">
        <div class="pwa-header">
          <div class="pwa-mark">
            <ta-logo></ta-logo>
          </div>
          <div class="pwa-text">
            <ta-title [level]="4">{{ 'ui.pwa.title' | translate }}</ta-title>
            <div class="pwa-description">{{ 'ui.pwa.description' | translate }}</div>
            <ta-link size="sm" (action)="this.dontAsk()">
              {{ 'ui.pwa.no-more' | translate }}
            </ta-link>
          </div>
        </div>
        <div class="pwa-actions">
          <ta-button type="tertiary" (action)="this.onNoClick()">
            {{ 'ui.pwa.cancel' | translate }}
          </ta-button>
          <ta-button type="secondary" icon="download" (action)="this.onYesClick()">
            {{ 'ui.pwa.install' | translate }}
          </ta-button>
        </div>
      </div>
    </ta-toast>
  </div>
}
