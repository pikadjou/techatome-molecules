<label class="toggle-switch">
  <input
    type="checkbox"
    (click)="this.input.value = !this.input.value"
    [checked]="this.input.value"
    [disabled]="this.input.disabled"
    [attr.aria-invalid]="this.input.formControl?.invalid"
  />
  <span class="slider"></span>
  @if (this.stateLabel(); as stateLabel) {
    <span class="toggle-state" [class.is-on]="this.input.value">{{ stateLabel | translate }}</span>
  }
  <ta-form-label [input]="this.input" [withMarginBottom]="false" variant="choice"></ta-form-label>
</label>
