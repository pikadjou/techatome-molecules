@if(this.input.level) {
<ta-title [level]="this.input.level" [icon]="this.input.icon">
  {{ this.input.label | translate }}
  @if(this.input.required) {
  <span class="required"> *</span>
  }
</ta-title>
} @else {
<div class="label-text flex-row align-center g-space-sm">
  @if(this.input.icon) {
  <ta-font-icon [name]="this.input.icon" />
  }
  <ta-text>{{ this.input.label | translate }}
    @if(this.input.required) {
    <span class="required"> *</span>
    }
  </ta-text>
</div>
}
