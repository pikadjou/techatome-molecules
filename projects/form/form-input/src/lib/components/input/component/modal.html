<ta-modal [open]="this.isOpen()" size="medium" title="input.component.modal.title" (closeEvent)="this.dismiss()">
  <div modal-content>
    @if (this.modalState()?.input()?.template; as template) {
      <ng-template
        [ngTemplateOutlet]="template"
        [ngTemplateOutletContext]="{ selectedValue$: this.selectedValue$ }"
      ></ng-template>
    }
  </div>
</ta-modal>
