<div>
  @switch (this.input.matchtype()) { @case ('textbox') {
  <ta-input-textbox [input]="$any(this.input)"></ta-input-textbox>
  } @case ('number') {
  <ta-input-textbox [input]="$any(this.input)"></ta-input-textbox>
  } @case ('checkbox') {
  <ta-input-checkbox [input]="$any(this.input)"></ta-input-checkbox>
  } @case ('datePicker') {
  <ta-input-date-picker [input]="$any(this.input)"></ta-input-date-picker>
  } @case ('dropdown') {
  <ta-input-dropdown [input]="$any(this.input)"></ta-input-dropdown>
  } @default {
  <span>{{ "input.switch.novalue" | translate }}</span>
  } }
</div>
